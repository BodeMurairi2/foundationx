name: foundationx
description: Africa's leading student-centered learning platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  percent_indicator: ^4.2.5
  smooth_page_indicator: ^1.0.0
  google_fonts: ^8.1.0
  provider: ^6.1.2
  go_router: ^17.2.3
  shared_preferences: ^2.3.0
  intl: ^0.20.2
  fluttertoast: ^9.1.0
  icons_plus: ^5.0.0

  # Firebase (ready for production)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true